name: Build and deploy Docusaurus

# Temporary PR synchronization trigger for the initial Pages deployment.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-master-deployment:
    name: Dispatch master deployment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the deployment workflow on master
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST "repos/${REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" -f ref=master
          gh pr comment "${PR_NUMBER}" --body "Dispatched the Pages deployment workflow on master."

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Report verification start
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: gh pr comment 1 --body "Pages verification started for commit ${COMMIT_SHA}."

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Docusaurus
        run: npm run build

      - name: Configure GitHub Pages
        id: configure
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        id: upload
        if: github.event_name != 'pull_request' && steps.configure.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - name: Report successful artifact upload
        if: github.event_name != 'pull_request' && steps.configure.outcome == 'success' && steps.upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1 --body "Pages repository configuration and Docusaurus artifact upload both succeeded. Deployment is the remaining stage."

      - name: Report Pages configuration failure
        if: github.event_name != 'pull_request' && steps.configure.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1 --body "Pages verification failed during repository configuration. GitHub Pages may not yet be enabled with **GitHub Actions** as its source."

      - name: Report artifact upload failure
        if: github.event_name != 'pull_request' && steps.configure.outcome == 'success' && steps.upload.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1 --body "Pages verification passed repository configuration, but failed while uploading the Docusaurus build artifact."

      - name: Fail unsuccessful build stage
        if: github.event_name != 'pull_request' && (steps.configure.outcome == 'failure' || steps.upload.outcome == 'failure')
        run: exit 1

  deploy:
    name: Deploy site
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Report successful deployment
        if: steps.deployment.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: gh pr comment 1 --body "Pages deployment verified successfully: ${PAGE_URL}"

      - name: Report deployment failure
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 1 --body "Pages verification reached the deployment stage, but GitHub rejected the deployment."

      - name: Fail unsuccessful deployment
        if: steps.deployment.outcome == 'failure'
        run: exit 1
